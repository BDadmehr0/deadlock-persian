<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- deadlock-persian: use Vazirmatn (راستیکردار) for Persian UI text.

         Deadlock's Panorama UI loads panorama/fonts/fonts.conf from the game
         VPKs, which includes conf.d/*.conf. This file is purely additive: it
         prepends Vazirmatn to the font family list for Arabic-script text
         (charset "Arabic") and for the fa (Persian) language, leaving every
         default font untouched. Vazirmatn is licensed under the SIL OFL 1.1
         (see vazirmatn/OFL.txt). -->
    <match target="pattern">
        <test qual="any" name="charset" compare="contains">
            <string>Arabic</string>
        </test>
        <edit name="family" mode="prepend">
            <string>Vazirmatn</string>
        </edit>
    </match>
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>fa</string>
        </test>
        <edit name="family" mode="prepend">
            <string>Vazirmatn</string>
        </edit>
    </match>
</fontconfig>
