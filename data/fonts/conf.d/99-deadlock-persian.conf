<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- deadlock-persian: Vazirmatn for Persian (Arabic-script) UI text. -->
<fontconfig>
    <!-- Every font request also lists Vazirmatn. For Persian/Arabic-script
         text the game's own fonts have no glyph coverage, so rendering falls
         to Vazirmatn; Latin and symbols keep using the game's fonts. -->
    <match>
        <edit name="family" mode="append">
            <string>Vazirmatn</string>
        </edit>
    </match>
    <!-- If a request does carry an Arabic charset, prefer Vazirmatn first. -->
    <match>
        <test qual="any" name="charset" compare="contains">
            <string>Arabic</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Vazirmatn</string>
        </edit>
    </match>
</fontconfig>
